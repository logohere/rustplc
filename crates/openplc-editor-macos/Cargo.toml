[package]
name = "open-rust-plc-editor"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
repository.workspace = true

[[bin]]
name = "openplc-editor"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
directories = "6.0.0"
dioxus = { version = "=0.7.3", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "asset"] }
dioxus-desktop = { version = "=0.7.3", default-features = false, features = ["tokio_runtime", "devtools"] } # 0.7.3 macOS menu code requires WebView devtools methods even in release; hot reload remains debug-only
open-rust-plc-compat-core = { path = "../compat-core" }
open-rust-plc-compiler = { path = "../compiler-core" }
rfd = "0.17.2"
regex = "1.12.2"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "=0.3.55", features = ["formatting"] }
native-tls = "=0.2.18"
tokio = { version = "=1.53.3", features = ["rt", "time"] }
tungstenite = { version = "=0.27.0", features = ["native-tls"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "=3.27.0"
